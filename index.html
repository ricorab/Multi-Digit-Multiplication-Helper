<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Standard Algorithm Multiplication Guide</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 700px;
    margin: 0 auto;
    padding: 16px;
    background: #f8f9fa;
    color: #222;
  }
  h1 { font-size: 1.4rem; text-align: center; margin-bottom: 0.5rem; }
  .subtitle { text-align: center; color: #555; margin-bottom: 1.5rem; font-size: 0.95rem; }
  .input-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  input[type="number"] {
    font-size: 1.3rem;
    padding: 8px 12px;
    width: 140px;
    border: 2px solid #ccc;
    border-radius: 8px;
    text-align: right;
  }
  button {
    font-size: 1.05rem;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #0066cc;
    color: white;
    cursor: pointer;
  }
  button:disabled { background: #aaa; cursor: not-allowed; }
  button.secondary { background: #555; }
  .problem-display {
    font-family: 'Courier New', monospace;
    font-size: 1.4rem;
    background: white;
    border: 2px solid #ddd;
    border-radius: 10px;
    padding: 16px;
    margin: 16px 0;
    white-space: pre;
    line-height: 1.4;
    min-height: 120px;
  }
  .label { color: #0066cc; font-weight: bold; }
  .step-box {
    background: #fff3cd;
    border: 2px solid #ffc107;
    border-radius: 10px;
    padding: 16px;
    margin: 16px 0;
    font-size: 1.15rem;
    line-height: 1.5;
  }
  .step-box strong { color: #856404; }
  .input-area {
    margin-top: 12px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .check-controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .visual-side {
    font-family: 'Courier New', monospace;
    font-size: 1.2rem;
    background: #f8f9fa;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 8px;
    line-height: 1;
    display: inline-block;
  }
  .visual-side table {
    border-collapse: collapse;
    margin: 0 auto;
  }
  .visual-side td {
    width: 1.4em;
    text-align: center;
    padding: 0;
    height: 1.3em;
  }
  .visual-side .carry {
    color: #d35400;
    font-size: 0.75em;
    font-weight: bold;
  }
  .visual-side .regroup-box {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 1px solid #aaa;
    border-radius: 2px;
    font-size: 11px;
    line-height: 12px;
    text-align: center;
    color: #d35400;
    font-weight: bold;
    vertical-align: middle;
  }
  .visual-side .write {
    color: #0066cc;
    font-weight: bold;
    background: #e7f3ff;
    border-radius: 3px;
  }
  .input-area input {
    font-size: 1.2rem;
    width: 100px;
    padding: 6px 10px;
    border: 2px solid #ccc;
    border-radius: 6px;
  }
  .feedback {
    margin-top: 10px;
    font-weight: bold;
  }
  .feedback.correct { color: #28a745; }
  .feedback.wrong { color: #dc3545; }
  .write-instruction {
    margin-top: 12px;
    padding: 10px;
    background: #e7f3ff;
    border-left: 4px solid #0066cc;
    border-radius: 4px;
  }
  .visual-mock {
    margin-top: 12px;
    font-family: 'Courier New', monospace;
    font-size: 1.3rem;
    background: #f8f9fa;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 10px;
    text-align: center;
    line-height: 1.2;
  }
  .visual-mock .carry {
    color: #d35400;
    font-size: 0.85rem;
    font-weight: bold;
  }
  .visual-mock .write {
    color: #0066cc;
    font-weight: bold;
    background: #e7f3ff;
    padding: 0 4px;
    border-radius: 3px;
  }
  .visual-mock .place-label {
    font-size: 0.7rem;
    color: #666;
    display: block;
    margin-top: 2px;
  }
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 12px;
  }
  .progress { text-align: center; color: #666; margin-top: 8px; font-size: 0.9rem; }
  .final-answer {
    background: #d4edda;
    border: 2px solid #28a745;
    border-radius: 10px;
    padding: 16px;
    text-align: center;
    font-size: 1.3rem;
    font-weight: bold;
    margin-top: 16px;
  }
</style>
</head>
<body>
<h1>Standard Algorithm Multiplication Guide</h1>
<p class="subtitle">Work on paper while the app walks you through each step.<br>Digits are labeled A, B, C… (top) then D, E, F… (bottom).</p>

<div class="input-row">
  <input type="number" id="top" placeholder="Top number" min="1" value="78">
  <span style="font-size:1.4rem;">×</span>
  <input type="number" id="bottom" placeholder="Bottom number" min="1" value="63">
  <button onclick="start()">Start Guide</button>
</div>

<div id="problem" class="problem-display">Enter numbers and click Start.</div>
<div id="step" class="step-box" style="display:none;"></div>
<div class="controls">
  <button id="prevBtn" class="secondary" onclick="prevStep()" disabled>← Previous</button>
  <button id="nextBtn" onclick="nextStep()" disabled>Next Step →</button>
</div>
<div id="progress" class="progress"></div>
<div id="final" class="final-answer" style="display:none;"></div>

<script>
let steps = [];
let currentStep = 0;
let topStr = "", bottomStr = "";
let topLabels = [], bottomLabels = [];
let partialProducts = [];
let carries = []; // temporary carry trackers per partial product

function getLabels(len, startCharCode) {
  return Array.from({length: len}, (_, i) => String.fromCharCode(startCharCode + i));
}

function start() {
  const topInput = document.getElementById("top").value.trim();
  const bottomInput = document.getElementById("bottom").value.trim();
  if (!topInput || !bottomInput || isNaN(topInput) || isNaN(bottomInput)) {
    alert("Please enter two whole numbers.");
    return;
  }
  topStr = topInput.replace(/^0+/, "") || "0";
  bottomStr = bottomInput.replace(/^0+/, "") || "0";
  if (topStr.length > 6 || bottomStr.length > 6) {
    alert("For now, keep numbers to 6 digits or fewer.");
    return;
  }

  topLabels = getLabels(topStr.length, 65); // A, B, C...
  bottomLabels = getLabels(bottomStr.length, 65 + topStr.length); // continues

  // Build steps
  steps = [];
  partialProducts = [];
  const topDigits = topStr.split("").map(Number).reverse(); // right to left for processing
  const bottomDigits = bottomStr.split("").map(Number).reverse();

  const places = ["ones", "tens", "hundreds", "thousands", "ten-thousands", "hundred-thousands", "millions"];

  // Generate multiplication steps
  for (let bIdx = 0; bIdx < bottomDigits.length; bIdx++) {
    const bDigit = bottomDigits[bIdx];
    const bLabel = bottomLabels[bottomStr.length - 1 - bIdx];
    const shift = bIdx;

    // Placeholder zeros instruction
    if (shift > 0) {
      let text;
      if (shift === 1) {
        text = `Now place a zero in the ones place of the next line because we are multiplying by a multiple of 10.`;
      } else if (shift === 2) {
        text = `Now place a zero in the ones place and a zero in the tens place of the next line because we are multiplying by a multiple of 100.`;
      } else if (shift === 3) {
        text = `Now place a zero in the ones place, a zero in the tens place, and a zero in the hundreds place of the next line because we are multiplying by a multiple of 1000.`;
      } else if (shift === 4) {
        text = `Now place a zero in the ones place, a zero in the tens place, a zero in the hundreds place, and a zero in the thousands place of the next line because we are multiplying by a multiple of 10000.`;
      } else {
        // fallback for larger (unlikely for 5th grade)
        const placeList = [];
        for (let p = 0; p < shift; p++) {
          placeList.push(`a zero in the ${places[p]} place`);
        }
        text = `Now place ${placeList.join(", ")} of the next line because we are multiplying by a multiple of ${"1" + "0".repeat(shift)}.`;
      }
      steps.push({
        type: "placeholder",
        text: text,
        shift
      });
    }

    let carry = 0;
    const productDigits = [];
    for (let tIdx = 0; tIdx < topDigits.length; tIdx++) {
      const tDigit = topDigits[tIdx];
      const tLabel = topLabels[topStr.length - 1 - tIdx];
      const product = tDigit * bDigit + carry;
      const write = product % 10;
      const newCarry = Math.floor(product / 10);
      productDigits.push(write);

      const writePlace = places[shift + tIdx] || "higher";
      const nextPlace = places[shift + tIdx + 1] || "higher";

      let prompt = `Multiply <strong>${bLabel} (${bDigit})</strong> × <strong>${tLabel} (${tDigit})</strong>.`;
      if (carry > 0) {
        const topPlaces = ["ones", "tens", "hundreds", "thousands", "ten-thousands"];
        const prevTopPlace = topPlaces[tIdx] || "higher";
        prompt += ` Don’t forget to add the <strong>${carry}</strong> you regrouped to the top of the <strong>${prevTopPlace} place</strong>.`;
      }

      steps.push({
        type: "multiply",
        prompt: prompt,
        expected: product,
        write,
        newCarry,
        writePlace,
        nextPlace,
        tIdx,
        shift,
        bLabel,
        tLabel,
        checked: false
      });
      carry = newCarry;
    }
    if (carry > 0) {
      productDigits.push(carry);
    }
    // Store the partial product (reversed digits + zeros)
    const pp = productDigits.reverse().join("") + "0".repeat(shift);
    partialProducts.push(pp);
  }

  // Addition steps
  steps.push({
    type: "add",
    text: "Now carefully add all the partial product lines together, lining up the places. Start from the rightmost column and regroup as needed.",
  });

  const finalProduct = (BigInt(topStr) * BigInt(bottomStr)).toString();
  steps.push({
    type: "finalAnswer",
    text: "Enter your final answer:",
    answer: finalProduct
  });

  currentStep = 0;
  document.getElementById("nextBtn").disabled = false;
  document.getElementById("prevBtn").disabled = true;
  document.getElementById("final").style.display = "none";
  renderProblem();
  showStep();
}

function renderProblem() {
  const topPadded = topStr.padStart(Math.max(topStr.length, bottomStr.length));
  const bottomPadded = bottomStr.padStart(Math.max(topStr.length, bottomStr.length));
  let html = "";
  // Top with labels above
  html += " ".repeat(2) + topLabels.map(l => `<span class="label">${l}</span>`).join(" ") + "\n";
  html += "  " + topStr.split("").join(" ") + "\n";
  html += "× " + bottomStr.split("").join(" ") + "\n";
  html += "  " + bottomLabels.map(l => `<span class="label">${l}</span>`).join(" ") + "\n";
  html += "─".repeat(Math.max(topStr.length, bottomStr.length) * 2 + 2);
  document.getElementById("problem").innerHTML = html;
}

function showStep() {
  if (currentStep < 0 || currentStep >= steps.length) return;
  const s = steps[currentStep];
  const stepEl = document.getElementById("step");
  stepEl.style.display = "block";

  let html = `<strong>Step ${currentStep + 1} of ${steps.length}</strong><br><br>`;

  if (s.type === "multiply") {
    html += s.prompt;
    html += `<div class="input-area">
      <div class="check-controls">
        <span>Enter the product:</span>
        <input type="number" id="answerInput" placeholder="?" onkeydown="if(event.key==='Enter') checkAnswer()">
        <button onclick="checkAnswer()">Check</button>
      </div>
      <div id="visualSide" class="visual-side" style="display:none;"></div>
    </div>
    <div id="feedback" class="feedback"></div>
    <div id="writeInstr" class="write-instruction" style="display:none;"></div>`;
    document.getElementById("nextBtn").disabled = !s.checked;
  } else if (s.type === "placeholder") {
    html += s.text;
    html += `<div class="visual-side" style="margin-top:12px; display:inline-block;">`;
    const shift = s.shift || 1;
    const placeIndex = { "ones":0, "tens":1, "hundreds":2, "thousands":3, "ten-thousands":4, "hundred-thousands":5, "millions":6 };

    // Collect all completed partial products so far
    const completedPPs = [];
    let currentPP = {};
    for (let i = 0; i < currentStep; i++) {
      const st = steps[i];
      if (st.type === "placeholder") {
        if (Object.keys(currentPP).length) completedPPs.push(currentPP);
        currentPP = {};
        // add the zeros for that line
        for (let p = 0; p < (st.shift||0); p++) {
          const place = Object.keys(placeIndex).find(k => placeIndex[k] === p);
          if (place) currentPP[place] = 0;
        }
      } else if (st.type === "multiply") {
        currentPP[st.writePlace] = st.write;
        const next = steps[i+1];
        if (st.newCarry > 0 && (!next || next.type === "placeholder" || next.type === "add")) {
          currentPP[st.nextPlace] = st.newCarry;
        }
      }
    }
    if (Object.keys(currentPP).length) completedPPs.push(currentPP);

    const allPlaces = completedPPs.flatMap(pp => Object.keys(pp).map(p => placeIndex[p]||0));
    const maxPlace = allPlaces.length ? Math.max(...allPlaces, shift) : shift;
    const baseLen = Math.max(topStr.length, bottomStr.length);
    const totalCols = Math.max(baseLen, maxPlace + 1);

    const topPadded = topStr.padStart(totalCols);
    const botPadded = bottomStr.padStart(totalCols);

    html += `<table>`;
    html += `<tr><td></td>`;
    for (let i = 0; i < totalCols; i++) html += `<td>${topPadded[i] === " " ? "" : topPadded[i]}</td>`;
    html += `</tr>`;
    html += `<tr><td>×</td>`;
    for (let i = 0; i < totalCols; i++) html += `<td>${botPadded[i] === " " ? "" : botPadded[i]}</td>`;
    html += `</tr>`;
    html += `<tr><td></td>`;
    for (let i = 0; i < totalCols; i++) html += `<td>─</td>`;
    html += `</tr>`;

    // All previous partial products
    completedPPs.forEach(pp => {
      html += `<tr><td></td>`;
      for (let i = 0; i < totalCols; i++) {
        const place = Object.keys(placeIndex).find(k => placeIndex[k] === (totalCols - 1 - i));
        html += `<td>${pp[place] !== undefined ? pp[place] : ""}</td>`;
      }
      html += `</tr>`;
    });

    // New line with zero(s)
    html += `<tr><td></td>`;
    for (let i = 0; i < totalCols; i++) {
      const fromRight = totalCols - 1 - i;
      html += `<td>${fromRight < shift ? `<span class="write">0</span>` : ""}</td>`;
    }
    html += `</tr>`;
    html += `</table></div>`;
    document.getElementById("nextBtn").disabled = false;
  } else if (s.type === "finalCarry") {
    html += s.text;
    document.getElementById("nextBtn").disabled = false;
  } else if (s.type === "add") {
    html += s.text;
    document.getElementById("nextBtn").disabled = false;
  } else if (s.type === "finalAnswer") {
    html += s.text;
    html += `<div class="input-area" style="margin-top:12px;">
      <div class="check-controls">
        <input type="number" id="finalInput" placeholder="Your answer" onkeydown="if(event.key==='Enter') checkFinal()">
        <button onclick="checkFinal()">Check</button>
      </div>
    </div>
    <div id="finalFeedback" class="feedback"></div>`;
    document.getElementById("nextBtn").disabled = true;
  } else if (s.type === "done") {
    html += s.text;
    document.getElementById("nextBtn").disabled = true;
    document.getElementById("final").style.display = "block";
    document.getElementById("final").innerHTML = `Final Answer: ${s.answer}`;
  }

  stepEl.innerHTML = html;
  document.getElementById("progress").textContent = `Progress: ${currentStep + 1} / ${steps.length}`;
  document.getElementById("prevBtn").disabled = currentStep === 0;

  if (s.type === "multiply" && s.checked) {
    // Re-show the correct feedback if going back
    document.getElementById("feedback").className = "feedback correct";
    document.getElementById("feedback").textContent = "Correct!";
    showWriteInstruction(s);
    document.getElementById("nextBtn").disabled = false;
  } else if (s.type !== "done") {
    document.getElementById("final").style.display = "none";
  }
}

function checkAnswer() {
  const s = steps[currentStep];
  if (s.type !== "multiply") return;
  const input = document.getElementById("answerInput");
  const val = parseInt(input.value, 10);
  const feedback = document.getElementById("feedback");
  if (isNaN(val)) {
    feedback.className = "feedback wrong";
    feedback.textContent = "Please enter a number.";
    return;
  }
  if (val === s.expected) {
    feedback.className = "feedback correct";
    feedback.textContent = "Correct!";
    s.checked = true;
    showWriteInstruction(s);
    document.getElementById("nextBtn").disabled = false;
  } else {
    feedback.className = "feedback wrong";
    feedback.textContent = "Not quite. Try again.";
    document.getElementById("nextBtn").disabled = true;
  }
}

function showWriteInstruction(s) {
  const el = document.getElementById("writeInstr");
  let text = "";

  // Is this the final digit of the current partial product?
  const nextStep = steps[currentStep + 1];
  const isFinalCarry = s.newCarry > 0 && (!nextStep || nextStep.type === "finalCarry" || nextStep.type === "placeholder" || nextStep.type === "add");

  // The regroup goes above the next digit of the top number.
  // Describe that place relative to the top number, not the product.
  const topPlaces = ["ones", "tens", "hundreds", "thousands", "ten-thousands"];
  const nextTopPlace = topPlaces[s.tIdx + 1] || "higher";

  if (s.newCarry > 0 && isFinalCarry) {
    text = `The <strong>${s.write}</strong> goes in the <strong>${s.writePlace} place</strong> and the <strong>${s.newCarry}</strong> goes in the <strong>${s.nextPlace} place</strong> of this partial product.`;
  } else if (s.newCarry > 0) {
    text = `The <strong>${s.write}</strong> goes in the <strong>${s.writePlace} place</strong> and the <strong>${s.newCarry}</strong> is regrouped to the top of the <strong>${nextTopPlace} place</strong>.`;
  } else {
    text = `Write <strong>${s.write}</strong> in the <strong>${s.writePlace} place</strong>. No regroup.`;
  }
  el.innerHTML = text;
  el.style.display = "block";

  const visualEl = document.getElementById("visualSide");
  if (visualEl) {
    const placeIndex = {
      "ones": 0,
      "tens": 1,
      "hundreds": 2,
      "thousands": 3,
      "ten-thousands": 4,
      "hundred-thousands": 5
    };

    // Collect all previous completed partial products
    // A line is completed only when we move past it to a new placeholder
    const completedPPs = [];
    let tempPP = {};
    for (let i = 0; i < currentStep; i++) {
      const st = steps[i];
      if (st.type === "placeholder") {
        if (Object.keys(tempPP).length) completedPPs.push(tempPP);
        tempPP = {};
        for (let p = 0; p < (st.shift||0); p++) {
          const place = Object.keys(placeIndex).find(k => placeIndex[k] === p);
          if (place) tempPP[place] = 0;
        }
      } else if (st.type === "multiply") {
        tempPP[st.writePlace] = st.write;
        const next = steps[i+1];
        if (st.newCarry > 0 && (!next || next.type === "placeholder" || next.type === "add")) {
          tempPP[st.nextPlace] = st.newCarry;
        }
      }
    }
    // Do NOT push tempPP here — it belongs to the current line
    // Only lines that ended at a placeholder are completed

    // Current line digits
    const written = {};
    let shift = 0;
    for (let i = currentStep; i >= 0; i--) {
      if (steps[i].type === "placeholder") {
        shift = steps[i].shift || 0;
        break;
      }
    }
    for (let p = 0; p < shift; p++) {
      const place = Object.keys(placeIndex).find(k => placeIndex[k] === p);
      if (place) written[place] = 0;
    }
    for (let i = currentStep; i >= 0; i--) {
      const step = steps[i];
      if (step.type === "placeholder") break;
      if (step.type === "multiply" && (i === currentStep || step.checked)) {
        written[step.writePlace] = step.write;
        if (step.newCarry > 0 && i === currentStep && isFinalCarry) {
          written[step.nextPlace] = step.newCarry;
        }
      }
    }

    const allPlaces = [...completedPPs.flatMap(pp => Object.keys(pp)), ...Object.keys(written)]
      .map(p => placeIndex[p] || 0);
    // Make sure the regroup column exists even if nothing is written there yet
    if (s.newCarry > 0 && !isFinalCarry && placeIndex[s.nextPlace] !== undefined) {
      allPlaces.push(placeIndex[s.nextPlace]);
    }
    const maxPlace = allPlaces.length ? Math.max(...allPlaces) : 0;
    const baseLen = Math.max(topStr.length, bottomStr.length);
    const totalCols = Math.max(baseLen, maxPlace + 1);

    const topPadded = topStr.padStart(totalCols);
    const botPadded = bottomStr.padStart(totalCols);

    let html = `<table>`;

    // Regroup row — a box for every place
    // The regroup goes directly above the next digit of the top number
    html += `<tr>`;
    html += `<td></td>`;
    for (let i = 0; i < totalCols; i++) {
      let cell = "";
      if (s.newCarry > 0 && !isFinalCarry && s.tIdx !== undefined) {
        // Next top digit is one place left of the digit we just multiplied
        // Top digits are right-aligned, so digit at tIdx is at column (totalCols - 1 - tIdx)
        // Next digit (tIdx+1) is at column (totalCols - 2 - tIdx)
        const nextTopCol = totalCols - 1 - (s.tIdx + 1);
        if (i === nextTopCol && nextTopCol >= 0) {
          cell = `<span class="carry">${s.newCarry}</span>`;
        }
      }
      html += `<td><span class="regroup-box">${cell}</span></td>`;
    }
    html += `</tr>`;

    // Top number
    html += `<tr>`;
    html += `<td></td>`;
    for (let i = 0; i < totalCols; i++) {
      html += `<td>${topPadded[i] === " " ? "" : topPadded[i]}</td>`;
    }
    html += `</tr>`;

    // Bottom number
    html += `<tr>`;
    html += `<td>×</td>`;
    for (let i = 0; i < totalCols; i++) {
      html += `<td>${botPadded[i] === " " ? "" : botPadded[i]}</td>`;
    }
    html += `</tr>`;

    // Line
    html += `<tr>`;
    html += `<td></td>`;
    for (let i = 0; i < totalCols; i++) {
      html += `<td>─</td>`;
    }
    html += `</tr>`;

    // Previous partial products
    completedPPs.forEach(pp => {
      html += `<tr><td></td>`;
      for (let i = 0; i < totalCols; i++) {
        const place = Object.keys(placeIndex).find(p => placeIndex[p] === (totalCols - 1 - i));
        html += `<td>${pp[place] !== undefined ? pp[place] : ""}</td>`;
      }
      html += `</tr>`;
    });

    // Current partial product
    html += `<tr>`;
    html += `<td></td>`;
    for (let i = 0; i < totalCols; i++) {
      const place = Object.keys(placeIndex).find(p => placeIndex[p] === (totalCols - 1 - i));
      let cell = "";
      if (written[place] !== undefined) {
        const isCurrent = (place === s.writePlace);
        cell = isCurrent ? `<span class="write">${written[place]}</span>` : written[place];
      }
      html += `<td>${cell}</td>`;
    }
    html += `</tr>`;

    html += `</table>`;
    visualEl.innerHTML = html;
    visualEl.style.display = "block";
  }
}

function checkFinal() {
  const s = steps[currentStep];
  const input = document.getElementById("finalInput");
  const feedback = document.getElementById("finalFeedback");
  const val = input.value.trim();
  if (val === s.answer) {
    feedback.className = "feedback correct";
    feedback.textContent = "Correct! " + s.answer;
    document.getElementById("final").style.display = "block";
    document.getElementById("final").innerHTML = `Final Answer: ${s.answer}`;
  } else {
    feedback.className = "feedback wrong";
    feedback.textContent = "Not quite. Check your addition and try again.";
  }
}

function nextStep() {
  if (currentStep < steps.length - 1) {
    currentStep++;
    showStep();
  }
}
function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    showStep();
  }
}
</script>
</body>
</html>
